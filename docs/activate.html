<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激活 License — WeChat Obsidian Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a2e; }
  .container { max-width: 600px; margin: 0 auto; padding: 40px 24px; }
  .card { background: white; border-radius: 12px; padding: 36px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size: 1.6em; margin-bottom: 8px; text-align: center; }
  .subtitle { text-align: center; color: #888; margin-bottom: 28px; }

  .step { margin-bottom: 28px; }
  .step-label { font-weight: 700; font-size: 0.9em; color: #667eea; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95em; }
  input, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; margin-bottom: 12px; font-family: monospace; }
  input:focus, textarea:focus { outline: none; border-color: #667eea; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; border: none; background: #667eea; color: white; transition: transform .2s; }
  .btn:hover { transform: scale(1.02); }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .divider { border-top: 1px solid #e0e0e0; margin: 28px 0; }

  .result { margin-top: 20px; padding: 20px; background: #e8f5e9; border-radius: 8px; display: none; }
  .result .key { font-family: monospace; font-size: 0.75em; word-break: break-all; background: white; padding: 12px; border-radius: 6px; margin: 12px 0; user-select: all; }
  .error { background: #ffebee; color: #c62828; }

  .qr-section { text-align: center; padding: 20px; background: #f8f9fc; border-radius: 8px; }
  .qr-section img { width: 200px; height: 200px; border: 4px solid white; border-radius: 8px; }
  .price-big { font-size: 2em; font-weight: 700; color: #667eea; }
  .note { font-size: 0.85em; color: #999; margin-top: 8px; }

  footer { text-align: center; margin-top: 30px; color: #999; font-size: 0.85em; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔑 激活 License</h1>
    <p class="subtitle">获取永久使用权，只需 ¥49</p>

    <!-- Step 1 -->
    <div class="step">
      <div class="step-label">步骤一</div>
      <label for="deviceCode">设备码</label>
      <input type="text" id="deviceCode" placeholder="运行 安装.bat 获取设备码，例如：EF4D87E773BC" maxlength="20">
      <p class="note">打开"安装.bat"，屏幕显示的 12 位码</p>
    </div>

    <!-- Step 2 -->
    <div class="step">
      <div class="step-label">步骤二</div>
      <label>扫码支付 ¥49</label>
      <div class="qr-section">
        <p class="price-big">¥49.00</p>
        <p style="margin:8px 0;">微信 / 支付宝扫码支付</p>
        <!-- Replace with actual QR code image -->
        <div style="width:200px; height:200px; margin:12px auto; background:#eee; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#999;">
          [收款码图片]<br>替换为此处
        </div>
        <p class="note">支付后截图保存交易记录</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Step 3 -->
    <div class="step">
      <div class="step-label">步骤三</div>
      <label for="txnId">付款交易号 / 截图链接</label>
      <input type="text" id="txnId" placeholder="微信/支付宝交易单号后 6 位，或付款截图链接">
      <p class="note">我们验证后会立即将 License Key 发送到你的邮箱</p>
    </div>

    <button class="btn" id="submitBtn" onclick="submitActivation()">提交激活请求</button>

    <div class="divider"></div>

    <p class="note" style="text-align:center;">提交后通常 10 分钟内通过邮件收到 Key。<br>如需加急请联系客服微信。</p>
  </div>
</div>

<footer>
  <p>WeChat Obsidian Bot · <a href="index.html" style="color:#667eea;">返回首页</a></p>
</footer>

<script>
async function submitActivation() {
  const deviceCode = document.getElementById('deviceCode').value.trim();
  const txnId = document.getElementById('txnId').value.trim();
  const btn = document.getElementById('submitBtn');

  if (!deviceCode) { alert('请先输入设备码'); return; }
  if (!txnId) { alert('请输入付款交易号或截图链接'); return; }

  btn.disabled = true;
  btn.textContent = '提交中...';

  // Submit to a lightweight backend (can be a serverless function or form service)
  // For now, use a simple form that sends to email or a webhook
  const data = { deviceCode, txnId, timestamp: new Date().toISOString() };

  try {
    // Placeholder: replace with actual endpoint
    // await fetch('https://your-api.com/activate', { method: 'POST', body: JSON.stringify(data) });

    // For now, show a success message with instructions
    btn.textContent = '已提交 ✓';
    btn.style.background = '#4caf50';

    const div = document.createElement('div');
    div.style.cssText = 'margin-top:16px; padding:16px; background:#e8f5e9; border-radius:8px; text-align:center;';
    div.innerHTML = '<strong>✅ 激活请求已提交</strong><br><br>请添加客服微信发送以下信息：<br><br><code>' + deviceCode + '</code><br><br>我们会立即回复 License Key';
    btn.parentNode.insertBefore(div, btn.nextSibling);

  } catch(e) {
    btn.disabled = false;
    btn.textContent = '提交失败，请重试';
  }
}
</script>
</body>
</html>
