<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激活 License — WeChat Obsidian Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#1a1a2e}
.container{max-width:600px;margin:0 auto;padding:40px 24px}
.card{background:white;border-radius:12px;padding:36px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h1{font-size:1.6em;margin-bottom:8px;text-align:center}
.subtitle{text-align:center;color:#888;margin-bottom:28px}
.step{margin-bottom:28px}
.step-label{font-weight:700;font-size:0.9em;color:#667eea;margin-bottom:8px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1em;margin-bottom:12px;font-family:monospace}
input:focus{outline:none;border-color:#667eea}
.btn{display:block;width:100%;padding:14px;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;border:none;background:#667eea;color:white}
.btn:hover{opacity:0.9}
.btn:disabled{background:#ccc;cursor:not-allowed}
.qr-section{text-align:center;padding:20px;background:#f8f9fc;border-radius:8px}
.qr-section img{width:200px;height:200px;border:4px solid white;border-radius:8px}
.price-big{font-size:2em;font-weight:700;color:#667eea}
.note{font-size:0.85em;color:#999;margin-top:8px}
footer{text-align:center;margin-top:30px;color:#999;font-size:0.85em}
.success{background:#e8f5e9}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🔑 激活 License</h1>
<p class="subtitle">三步获取永久使用权 · ¥49</p>

<div class="step">
  <div class="step-label">① 输入设备码</div>
  <label for="deviceCode">设备码</label>
  <input type="text" id="deviceCode" placeholder="运行 安装.bat 后屏幕显示的 12 位码" maxlength="20">
  <p class="note">例如：EF4D87E773BC</p>
</div>

<div class="step">
  <div class="step-label">② 扫码支付</div>
  <label>微信 / 支付宝 ¥49.00</label>
  <div class="qr-section">
    <p class="price-big">¥49.00</p>
    <img src="ReceiveMoney.jpg" alt="收款码" style="width:200px;height:200px;margin:12px auto;border:4px solid white;border-radius:8px;object-fit:contain;">
  </div>
</div>

<div class="step">
  <div class="step-label">③ 获取 License Key</div>
  <button class="btn" id="submitBtn" onclick="done()">我已支付，获取 License Key</button>
</div>

<div id="result"></div>

<div style="border-top:1px solid #e0e0e0;margin-top:20px;padding-top:20px;text-align:center;">
  <p>不会操作？直接加微信 <strong style="font-size:1.1em;">15919122865</strong></p>
  <p class="note">发设备码 + 付款截图，秒回 License Key</p>
</div>
</div>
</div>

<footer><p>WeChat Obsidian Bot · <a href="index.html" style="color:#667eea;">返回首页</a></p></footer>

<script>
function done() {
  const code = document.getElementById('deviceCode').value.trim();
  if (!code) { alert('请先输入设备码'); return; }

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '已提交 ✓';
  document.getElementById('submitBtn').style.background = '#4caf50';

  document.getElementById('result').innerHTML =
    '<div class="success" style="margin-top:16px;padding:20px;border-radius:8px;text-align:center;">' +
    '<strong>最后一步：发送设备码给客服</strong><br><br>' +
    '<p style="font-size:1.2em;"><code>' + code + '</code></p><br>' +
    '<p>添加微信 <strong style="font-size:1.1em;">15919122865</strong></p>' +
    '<p>发送设备码和付款截图</p>' +
    '<p style="margin-top:8px;color:#4caf50;">→ 立即收到 License Key</p><br>' +
    '<p class="note">收到 Key 后：打开 config.json → 填入 license_key → 双击启动.bat</p>' +
    '</div>';
}
</script>
</body>
</html>
